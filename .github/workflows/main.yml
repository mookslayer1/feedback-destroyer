name: Build Feedback Destroyer (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign and zip the VST3
        run: |
          mkdir -p dist
          bundle=$(find build -name "*.vst3" -type d -prune | head -n 1)
          echo "Found: $bundle"
          codesign --force --deep -s - "$bundle"
          ditto -c -k --keepParent "$bundle" dist/FeedbackDestroyer-VST3-mac.zip

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: FeedbackDestroyer-VST3-mac
          path: dist/FeedbackDestroyer-VST3-mac.zip
